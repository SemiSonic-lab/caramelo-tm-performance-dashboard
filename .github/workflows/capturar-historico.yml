name: Capturar histórico de rendimiento

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de captura
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Registrar captura histórica
        run: python capturar_historico.py

      - name: Guardar cambios en el repositorio
        run: |
          if git diff --quiet -- historico_indicadores.csv; then
            echo "No hay una nueva captura para guardar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historico_indicadores.csv
            git commit -m "Update historical performance snapshot"
            git push
          fi
